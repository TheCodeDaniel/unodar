# Analyze, format-check and test every package, with the real Arduino toolchain.
#
# UNODAR_REQUIRE_ARDUINO=1 turns every `arduino`-tagged test (arduino-cli compiles, size budgets, fidelity
# harnesses, reserved names) from "skip with install instructions" into a failure when the toolchain is missing.
# As a second guard, the test step fails if the run reports any skipped test at all.
#
# Versions are pinned: size budgets and the generated E014 deny-list depend on the exact arduino:avr core (and its
# avr-gcc), and formatting depends on the Dart SDK. The Arduino toolchain is installed by `unodar setup --dev` itself
# (the pins are tool/arduino_toolchain.txt and tool/arduino_libraries.txt), so CI exercises the same install a user
# runs. Bump versions deliberately, together with any budget change.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DART_SDK_VERSION: 3.13.2
  NODE_VERSION: 22.12.0
  UNODAR_REQUIRE_ARDUINO: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.DART_SDK_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.DART_SDK_VERSION }}-

      # The runtime fidelity harness runs programs in avr8js (tool/avr_runner, pinned by package-lock.json); `unodar
      # setup --dev` runs its npm ci, but Node itself is the machine's.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: dart pub get

      # ~/.unodar holds the managed arduino-cli, the arduino:avr core with its avr-gcc, and the pinned libraries.
      - name: Cache the managed Arduino toolchain
        uses: actions/cache@v4
        with:
          path: ~/.unodar
          key: unodar-${{ runner.os }}-${{ hashFiles('tool/arduino_toolchain.txt', 'tool/arduino_libraries.txt') }}

      # Installs only what is missing (nothing on a cache hit) and exits non-zero unless `unodar doctor --dev` is clean.
      - name: unodar setup --dev
        run: dart run unodar_compiler:unodar setup --dev

      - run: dart analyze

      - run: dart format --set-exit-if-changed .

      - name: Test packages/unodar
        working-directory: packages/unodar
        run: |
          dart test --file-reporter "json:$RUNNER_TEMP/unodar.json"
          ../../tool/ci_no_skips.sh "$RUNNER_TEMP/unodar.json"

      - name: Test packages/unodar_compiler
        working-directory: packages/unodar_compiler
        run: |
          dart test --file-reporter "json:$RUNNER_TEMP/unodar_compiler.json"
          ../../tool/ci_no_skips.sh "$RUNNER_TEMP/unodar_compiler.json"

  # The README quick start on a runner with nothing but a Dart SDK (tool/fresh_machine_test.sh: a fresh HOME and a
  # PATH without anything else). Until the release tag exists it installs the commit under test. No board is plugged
  # in, so `unodar flash` must end with exit 4 and "No Arduino Uno found".
  fresh-machine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}
      - run: tool/fresh_machine_test.sh

  # The oldest Dart SDK unodar supports (D8): the minimum that the analyzer dependency allows (pubspec.lock's
  # `sdks: dart`). The compiler is analyzed and its unit and golden tests run with it; the Arduino tests run above.
  minimum-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.0
      - run: dart pub get
      - run: dart analyze
      - name: Unit and golden tests
        working-directory: packages/unodar_compiler
        run: dart test test/unit test/golden_test.dart
