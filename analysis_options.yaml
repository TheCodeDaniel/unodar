include: package:lints/recommended.yaml

formatter:
  # Project-wide line length. Every package inherits this file, so `dart format` enforces 120 everywhere.
  page_width: 120

analyzer:
  exclude:
    # Golden inputs are compiler test fixtures, several of which are deliberately invalid Dart (E007 cases).
    # They are analyzed by the compiler under test, not by the repo's own `dart analyze`.
    - packages/unodar_compiler/test/golden/**
    - "**/.dart_tool/**"
    - "**/build/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - directives_ordering
